requires:
  PSRule.Rules.Azure: '1.47.0'

include:
  module:
    - PSRule.Rules.Azure

configuration:
  AZURE_BICEP_CHECK_TOOL: true
  AZURE_BICEP_PARAMS_FILE_EXPANSION: true

execution:
  unprocessedObject: Ignore

input:
  pathIgnore:
    - '**'
    - '!main.bicepparam'

output:
  culture:
    - en-US
  style: GitHubActions

rule:
  baseline: Azure.All